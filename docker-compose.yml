services:
  parakeet-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: parakeet-subtitle-api
    ports:
      - "8000:8000"
    volumes:
      - ./temp:/app/temp
      - model_cache:/root/.cache
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  model_cache:
    driver: local